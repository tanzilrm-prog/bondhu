<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bondhu</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#1877f2"><link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f0f2f5;--card:#fff;--tx:#1c1e21;--mu:#65676b;--pr:#1877f2;--bd:#dddfe2}
@media (prefers-color-scheme:dark){:root{--bg:#18191a;--card:#242526;--tx:#e4e6eb;--mu:#b0b3b8;--pr:#4599ff;--bd:#3a3b3c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header b{color:var(--pr);font-size:22px}
main{max-width:620px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--mu);padding:6px 10px}button.g.on{color:var(--pr);font-weight:600}
button.s{background:var(--bd);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.av{width:38px;height:38px;border-radius:50%;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.mu{color:var(--mu);font-size:13px}img.av{object-fit:cover;display:block}img.p{width:100%;border-radius:8px;margin-top:8px;display:block}
.cm{background:var(--bg);border-radius:14px;padding:6px 12px;margin:4px 0;font-size:14px}
.vb{display:inline-flex;width:15px;height:15px;border-radius:50%;background:var(--pr);color:#fff;font-size:10px;align-items:center;justify-content:center;vertical-align:middle;margin-left:3px}
.tabs button{background:transparent;color:var(--mu);border-radius:0;border-bottom:3px solid transparent}.tabs button.on{color:var(--pr);border-color:var(--pr)}
</style></head><body>
<div id="app"></div>
<footer style="text-align:center;padding:16px 12px 24px;font-size:13px;color:var(--mu)">Powered by <b>Tanzil</b></footer>
<div id="cl" style="display:none;position:fixed;inset:0;background:#000e;color:#fff;z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:12px">
<video id="rv" autoplay playsinline style="max-width:92%;max-height:55%;border-radius:10px"></video>
<video id="lv" autoplay playsinline muted style="width:90px;border-radius:8px;position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px))"></video>
<h2 id="cn" style="margin:0"></h2><div id="cs"></div><div class="row" id="cb"></div><div id="om" style="display:none;flex-direction:column;gap:8px;align-items:stretch;min-width:240px"></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
let S=null,tab='feed',cw=null,img=null,vid=null,tagSel=[],vis='pub',allowSel=[],rxOpen=null,gal='all',AD=null,ntB=0,busy=false,cbusy=false,pbusy=false,sock,tk=localStorage.getItem('bt'),seen={},sq='',sf='all',ICE=null,ICEt=0,pushOn=false,ct=null;
let seenFor=null;const loadSeen=id=>{try{seen=JSON.parse(localStorage.getItem('bs'+id)||'{}')}catch(e){seen={}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const U=id=>S.users.find(u=>u.id==id)||(S.pages||[]).find(g=>g.id==id)||{name:'?'};
const vb=u=>u&&u.ver?'<span class="vb" title="Verified">✓</span>':'';
const mt=(x,q)=>String(x||'').toLowerCase().includes(q);
const av=(u,z)=>{u=u||{};const st=z?`width:${z}px;height:${z}px;font-size:${Math.round(z/2.3)}px`:'';return u.pic?`<img class="av" src="${u.pic}" style="${st}">`:`<div class="av" style="${st}">${esc((u.name||'?')[0]).toUpperCase()}</div>`};
const isF=id=>id!=S.me&&S.fr.some(f=>f.includes(id));
const thr=id=>S.mt.find(t=>t.a==id||t.b==id);
const canTalk=id=>isF(id)||S.mt.some(t=>t.st=='ok'&&(t.a==id||t.b==id));
const on=id=>S.online.includes(id)?'🟢':'';
const unread=id=>S.msgs.filter(m=>m.a==id&&m.id>(seen[id]||0)).length;
const ago=t=>{let m=(Date.now()-t)/6e4|0;return m<1?'ekhon':m<60?m+' min age':m<1440?(m/60|0)+' ghonta age':(m/1440|0)+' din age'};
async function api(p,b){try{const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:b?JSON.stringify(b):undefined});
 if(r.status==401){logout();return null}const j=await r.json();if(!r.ok){alert(j.e||'Error');return null}return j}catch(e){return null}}
let lastN=0,lastM=0,first=true;
function pushN(){const mx=S.nt.reduce((a,n)=>Math.max(a,n.id),0),mm=S.msgs.filter(m=>m.a!=S.me).reduce((a,m)=>Math.max(a,m.id),0);
 if(!first&&document.hidden&&!pushOn&&window.Notification&&Notification.permission=='granted'){
  S.nt.filter(n=>n.id>lastN&&!n.r).forEach(n=>new Notification('Bondhu',{body:(n.f?U(n.f).name+' ':'')+n.tx}));
  S.msgs.filter(m=>m.a!=S.me&&m.id>lastM).slice(-3).forEach(m=>new Notification(U(m.a).name,{body:m.text||(m.m?(m.m.k=='img'?'📷 Photo':'🎬 Video'):'')}))}
 lastN=mx;lastM=mm;first=false}
async function load(){const r=await api('state');if(r){if(seenFor!=r.me){seenFor=r.me;loadSeen(r.me)}S=r;if(S.admin&&tab=='adm'){const a=await api('admin');if(a)AD=a}pushN();draw()}}
async function loadAd(){AD=await api('admin');draw()}
async function auth(p){const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('n').value,pw:$('p').value})});
 const j=await r.json();if(!r.ok)return alert(j.e);tk=j.token;localStorage.setItem('bt',tk);start()}
function start(){sock=io({auth:{token:tk}});sock.on('sync',load);sock.on('sig',onSig);sock.on('connect_error',e=>{if(e.message=='auth')logout()});load();pushSub(false);iceS()}
function logout(){pushOn=false;tk=null;S=null;AD=null;tab='feed';cw=null;seenFor=null;seen={};first=true;lastN=0;lastM=0;localStorage.removeItem('bt');sock&&sock.disconnect();draw()}
async function signOut(){if(!confirm('Logout korbe? Arekta account diye login korte parbe.'))return;const t=tk;try{const rg=await navigator.serviceWorker.getRegistration('/'),sb=rg&&await rg.pushManager.getSubscription();if(sb)await fetch('/api/push/unsub',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({ep:sb.endpoint})})}catch(e){}
 try{await fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+t}})}catch(e){}logout()}

function draw(){const a=document.activeElement,k=a&&a.id,v=a&&a.value,A=$('app'),td=$('t')?$('t').value:'',kv={};document.querySelectorAll('#app [id^="k_"]').forEach(e=>kv[e.id]=e.value);
 if(!tk){A.innerHTML=`<main><div class="card"><h2 style="color:var(--pr);margin:0 0 8px">Bondhu</h2><p class="mu">Account khulo ba login koro.</p><input id="n" placeholder="Naam"><input id="p" type="password" placeholder="Password" onkeydown="if(event.key=='Enter')auth('login')"><div class="row"><button onclick="auth('login')">Login</button><button onclick="auth('signup')" style="background:#42b72a">Sign up</button></div></div></main>`;return}
 if(!S){A.innerHTML='<main><p class="mu">Loading...</p></main>';return}
 const nr=S.rq.filter(r=>r.to==S.me).length,un=S.users.reduce((s,x)=>s+unread(x.id),0),nn=S.nt.filter(n=>!n.r).length;document.title=(nn+un?'('+(nn+un)+') ':'')+'Bondhu';
 const b=({feed,ppl,chat,sr:srV,gal:galV,nt:ntV,adm:admV,set:setV}[tab]||feed)();if(tab=='nt'&&nn&&!ntB){ntB=1;api('nt/read',{}).then(()=>ntB=0)}
 A.innerHTML=`<header><b>Bondhu</b><div class="row"><span style="cursor:pointer;display:flex" onclick="tab='set';cw=null;draw()">${av(U(S.me),30)}</span><span class="mu">${esc(U(S.me).name)}</span><button class="g" onclick="signOut()">Logout / Switch</button></div></header><main><div class="tabs row">${[['feed','Feed'],['ppl','Bondhu'+(nr?' ('+nr+')':'')],['chat','Chat'+(un?' ('+un+')':'')],['sr','🔍'],['gal','🖼'],['nt','🔔'+(nn?' ('+nn+')':'')],['set','⚙️']].concat(S.admin?[['adm','🛡️']]:[]).map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';cw=null;${k=='adm'?'loadAd()':'draw()'}">${l}</button>`).join('')}</div>${b}</main>`;
 if($('t')&&td)$('t').value=td;for(const i in kv){const e=$(i);if(e)e.value=kv[i]}if(k){const e=$(k);if(e){e.value=v;e.focus()}}if($('ms'))$('ms').scrollTop=1e9}

const tg=id=>{const i=tagSel.indexOf(id);i<0?tagSel.push(id):tagSel.splice(i,1);draw()};
const tagUI=()=>{const f=S.users.filter(x=>isF(x.id));return f.length?`<div class="row" style="margin:6px 0"><span class="mu">Tag:</span>${f.map(x=>`<button class="g ${tagSel.includes(x.id)?'on':''}" onclick="tg(${x.id})">@${esc(x.name)}</button>`).join('')}</div>`:''};
const VL={pub:'🌐 Public',fr:'👥 Friends',cus:'⚙️ Custom',me:'🔒 Only me'};
const al=id=>{const i=allowSel.indexOf(id);i<0?allowSel.push(id):allowSel.splice(i,1);draw()};
const visUI=()=>`<div class="row" style="margin:6px 0"><span class="mu">Ke dekhbe:</span><select onchange="vis=this.value;draw()" style="padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)">${Object.keys(VL).map(k=>`<option value="${k}" ${vis==k?'selected':''}>${VL[k]}</option>`).join('')}</select></div>`+(vis=='cus'?`<div class="row" style="margin:6px 0"><span class="mu">Select:</span>${S.users.filter(x=>isF(x.id)).map(x=>`<button class="g ${allowSel.includes(x.id)?'on':''}" onclick="al(${x.id})">${esc(x.name)}</button>`).join('')||'<span class="mu">Kono bondhu nai</span>'}</div>`:'');
const RX={like:'👍',love:'❤️',haha:'😂',wow:'😮',sad:'😢',angry:'😡',dislike:'👎',fire:'🔥'};
const rxSum=p=>{const c={};Object.values(p.rx||{}).forEach(k=>c[k]=(c[k]||0)+1);return Object.keys(c).map(k=>RX[k]+' '+c[k]).join('  ')};
const react=(id,k)=>{rxOpen=null;act('react/'+id+'/'+k)};
const report=(type,id)=>{const r=prompt('Report er karon likho');if(r&&r.trim())act('report',{type,id,reason:r})};
const card=p=>{const my=(p.rx||{})[S.me],tgs=p.tags||[],own=p.uid==S.me,rs=rxSum(p);
 return `<div class="card"><div class="row sp"><div class="row">${av(U(p.uid))}<div><b>${esc(U(p.uid).name)}</b>${vb(U(p.uid))}${isF(p.uid)?' <span class="mu">· bondhu</span>':''}<div class="mu">${ago(p.t)} · ${p.pg?'📰 News':VL[p.vis||'pub']}</div></div></div>${own||S.admin?`<button class="g" onclick="if(confirm(${S.admin&&!own?'\'Post permanently delete korbe?\'':'\'Post Trash e jabe. Pore ferot ante parbe.\''}))act('post/${p.id}/del')">🗑</button>`:`<button class="g" onclick="report('post',${p.id})">🚩</button>`}</div>${p.pg?`<p style="white-space:pre-wrap;margin-bottom:4px"><b>${esc(p.text)}</b></p>${p.desc?`<p class="mu" style="margin:0 0 6px">${esc(p.desc)}</p>`:''}${/^https?:\/\//.test(p.link||'')?`<a href="${esc(p.link)}" target="_blank" rel="noopener noreferrer">🔗 Puro khobor poro</a>`:''}`:`<p style="white-space:pre-wrap">${esc(p.text)}</p>`}${tgs.length?`<div class="mu">— ${tgs.map(i=>'@'+esc(U(i).name)).join(', ')} ke tag kora hoyeche${tgs.includes(S.me)?' (tomake!)':''}</div>`:''}${p.img?`<img class="p" src="${p.img}">`:''}${p.vid?`<video class="p" src="${p.vid}" controls playsinline preload="metadata"></video>`:''}${rs?`<div class="mu" style="margin-top:6px">${rs}</div>`:''}<div class="row" style="border-top:1px solid var(--bd);margin-top:8px;padding-top:6px"><button class="g ${my?'on':''}" onclick="rxOpen=rxOpen==${p.id}?null:${p.id};draw()">${my?RX[my]:'🙂'} React</button><span class="mu">💬 ${p.c.length}</span></div>${rxOpen==p.id?`<div class="row" style="margin-top:4px">${Object.keys(RX).map(k=>`<button class="g" style="font-size:20px" onclick="react(${p.id},'${k}')">${RX[k]}</button>`).join('')}</div>`:''}${p.c.map(c=>`<div class="cm"><b>${esc(U(c.uid).name)}</b> ${esc(c.text)}</div>`).join('')}<input id="c${p.id}" placeholder="Comment likho, Enter chapo" onkeydown="if(event.key=='Enter')cmt(${p.id})"></div>`};
const nbn=()=>pushOk()&&!pushOn&&Notification.permission=='default'?`<div class="card row sp"><span class="mu">🔔 App bondho thakleo notification pete chao?</span><button onclick="askNotif()">On koro</button></div>`:'';
const feed=()=>nbn()+`<div class="card"><textarea id="t" rows="2" placeholder="Tomar mone ki chole?"></textarea>${img?`<img class="p" src="${img}">`:''}${vid?`<video class="p" src="${vid.local}" controls playsinline></video>`:''}${tagUI()}${visUI()}<div class="row sp"><div class="row"><label class="mu" style="cursor:pointer">📷 Photo<input type="file" accept="image/*" hidden onchange="pick(this)"></label><label class="mu" style="cursor:pointer">🎬 Video<input type="file" accept="video/*" hidden onchange="pickVid(this)"></label></div><button onclick="post()" ${busy?'disabled':''}>${busy?'Upload hochche...':'Post'}</button></div></div>`+
 ([...S.posts].reverse().map(card).join('')||'<p class="mu">Ekhono kono post nai. Prothom post tumi koro! 🔍 theke newspaper/page follow korle tader post ekhane ashbe.</p>');
async function act(p,b){await api(p,b||{});load()}
async function post(){if(busy)return;if(vis=='cus'&&!allowSel.length)return alert('Custom e ontoto ekjon bondhu select koro');const t=$('t').value.trim();if(!t&&!img&&!vid)return;busy=true;draw();let url=null;
 if(vid){try{const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':vid.file.type||'video/mp4',Authorization:'Bearer '+tk},body:vid.file}),j=await r.json();if(!r.ok)throw new Error(j.e||'Error');url=j.url}catch(e){busy=false;draw();return alert('Video upload hoyni: '+e.message)}}
 const ok=await api('post',{text:t,img,vid:url,tags:tagSel,vis,allow:allowSel});busy=false;if(ok){img=null;vid=null;tagSel=[];$('t').value=''}draw()}
function pickVid(i){const f=i.files[0];if(!f)return;if(f.size>40*1048576)return alert('Video 40MB er choto hote hobe (kom quality/choto kore nao)');
 const l=URL.createObjectURL(f),v=document.createElement('video');v.preload='metadata';
 v.onloadedmetadata=()=>{if(v.duration>60)return alert('Short video max 60 second');vid={file:f,local:l};img=null;draw()};
 v.onerror=()=>alert('Ei video format cholbe na (mp4 use koro)');v.src=l}
async function cmt(id){const e=$('c'+id),t=e.value.trim();if(!t)return;e.value='';act('comment/'+id,{text:t})}
function pick(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.7);draw()};im.src=r.result};r.readAsDataURL(f)}

function frBtn(id){const m=S.me;
 if(isF(id))return `<button class="s" onclick="if(confirm('Unfriend korbe?'))act('fr/${id}/rm')">Bondhu ✓</button>`;
 if(S.rq.some(r=>r.from==m&&r.to==id))return `<button class="s" onclick="act('fr/${id}/add')">Request pathano hoyeche ✕</button>`;
 if(S.rq.some(r=>r.from==id&&r.to==m))return `<button onclick="act('fr/${id}/acc')">Accept</button>`;
 return `<button onclick="act('fr/${id}/add')">Add friend</button>`}
const prow=x=>`<div class="row sp" style="margin-top:10px"><div class="row">${av(x)}<div><b>${esc(x.name)}</b> ${on(x.id)}<div class="mu">👥 ${(S.mut||{})[x.id]||0} mutual bondhu</div></div></div><div class="row"><button class="s" onclick="cw=${x.id};tab='chat';draw()">💬 Message</button>${frBtn(x.id)}<button class="g" title="Report" onclick="report('user',${x.id})">🚩</button><button class="g" title="Block" onclick="if(confirm('Block korbe?'))act('block/${x.id}/1')">🚫</button></div></div>`;
const ppl=()=>{const r=S.rq.filter(x=>x.to==S.me),bl=S.users.filter(x=>S.bl.includes(x.id)),fl=S.users.filter(x=>isF(x.id)&&!S.bl.includes(x.id));
 return (r.length?`<div class="card"><b>Friend request (${r.length})</b>`+r.map(x=>`<div class="row sp" style="margin-top:10px"><div class="row">${av(U(x.from))}<div><b>${esc(U(x.from).name)}</b><div class="mu">👥 ${(S.mut||{})[x.from]||0} mutual bondhu</div></div></div><div class="row"><button onclick="act('fr/${x.from}/acc')">Accept</button><button class="g" onclick="act('fr/${x.from}/rej')">Delete</button></div></div>`).join('')+`</div>`:'')+
 `<div class="card"><b>👥 Amar bondhu (${fl.length})</b><div class="mu">🔒 Ei list shudhu tumi dekhte paro. Onno keu tomar friend list dekhbe na, shudhu koto jon mutual ta dekhbe.</div>`+(fl.map(prow).join('')||'<p class="mu">Ekhono kono bondhu nai. Niche 🔍 Manush khojo theke Add friend koro.</p>')+`</div>`+
 `<div class="card row sp"><span class="mu">Notun manush khujte chao?</span><button onclick="tab='sr';sf='ppl';cw=null;draw()">🔍 Manush khojo</button></div>`+
 (bl.length?`<div class="card"><b>Blocked</b>`+bl.map(x=>`<div class="row sp" style="margin-top:10px"><b>${esc(x.name)}</b><button class="s" onclick="act('block/${x.id}/0')">Unblock</button></div>`).join('')+`</div>`:'')};

/* ---- Search ---- */
const SF={all:'Shob',ppl:'Manush',pg:'Page / News',vid:'Video'};
const pgRow=g=>{const f=S.pf.includes(g.id);return `<div class="row sp" style="margin-top:10px"><div class="row">${av(g)}<div><b>${esc(g.name)}</b>${vb(g)}<div class="mu">${g.fol} follower</div></div></div><button class="${f?'s':''}" onclick="act('pg/${g.id}/${f?0:1}')">${f?'Following ✓':'Follow'}</button></div>`};
const sec=(t,h)=>h.length?`<div class="card"><b>${t}</b>${h.join('')}</div>`:'';
function srRes(){const q=sq.trim().toLowerCase(),o=[],all=sf=='all',list=[...S.posts].reverse();
 if((all||sf=='ppl')&&(q||sf=='ppl'))o.push(sec('Manush',S.users.filter(x=>x.id!=S.me&&!S.bl.includes(x.id)&&(!q||mt(x.name,q))).map(prow)));
 if(all||sf=='pg'){o.push(sec('Page / Newspaper',S.pages.filter(g=>!q||mt(g.name,q)).map(pgRow)));
  if(q)o.push(...list.filter(p=>p.pg&&(mt(p.text,q)||mt(p.desc,q))).slice(0,15).map(card))}
 if((all&&q)||sf=='vid')o.push(...list.filter(p=>p.vid&&(!q||mt(p.text,q)||mt(U(p.uid).name,q))).slice(0,20).map(card));
 return o.join('')||'<p class="mu">Kichu pawa jayni.</p>'}
const srUpd=()=>{const e=$('sr');if(e)e.innerHTML=srRes()};
const srV=()=>`<div class="card"><input id="q" value="${esc(sq)}" placeholder="🔍 Bondhu, video, newspaper/page khojo..." oninput="sq=this.value;srUpd()"><div class="row">${Object.keys(SF).map(k=>`<button class="g ${sf==k?'on':''}" onclick="sf='${k}';draw()">${SF[k]}</button>`).join('')}</div>${sf=='pg'||sf=='all'?'<div class="mu">Page follow korle tader post tomar Feed e ashbe.</div>':''}</div><div id="sr">${srRes()}</div>`;

function chat(){
 if(cw){const o=U(cw),m=S.msgs.filter(x=>x.a==cw||x.b==cw),t=thr(cw),ok=canTalk(cw),bk=S.bl.includes(cw),inReq=!ok&&t&&t.st=='pending'&&t.b==S.me;
  if(m.length){seen[cw]=m[m.length-1].id;localStorage.setItem('bs'+S.me,JSON.stringify(seen))}
  return `<div class="card"><div class="row sp"><div class="row"><button class="g" onclick="cw=null;draw()">←</button>${av(o)}<b>${esc(o.name)}</b>${on(cw)}</div><div class="row">${ok?`<button class="g" onclick="call(${cw},0)">📞</button><button class="g" onclick="call(${cw},1)">🎥</button>`:''}<button class="g" onclick="if(confirm('Block korbe?')){act('block/${cw}/1');cw=null}">🚫</button></div></div>`+

 const r=await fetch('/api/admin/restore',{method:'POST',headers:{'Content-Type':'text/plain',Authorization:'Bearer '+tk},body:await f.text()}),j=await r.json().catch(()=>({}));alert(r.ok?'Restore hoyeche. Abar login koro.':(j.e||'Restore hoyni'));if(r.ok)logout()}
function setMax(){const n=+$('mx').value;if(n>=2)act('admin/max',{n})}

/* ---- Voice/Video call (WebRTC) ---- */
let pc,ls,peer,inc,buf=[];
const sig=(to,data)=>sock.emit('sig',{to,data});
const endBtn='<button onclick="outMenu()" style="background:#3a3b3c;padding:12px 18px">🔊 Sound</button><button onclick="end()" style="background:#e41e3f;padding:12px 24px">Call shesh</button>';

/* ---- Call audio output: loud speaker / bluetooth / neckband (wired) ---- */
let outSel='',outDevs=[];
const sinkOk=()=>!!(window.HTMLMediaElement&&HTMLMediaElement.prototype.setSinkId);
const outKind=d=>{const l=(d.label||'').toLowerCase();return/bluetooth|airpods|buds|\bbt\b|a2dp|hands-?free/.test(l)?'bt':/headset|headphone|earphone|wired|usb|neckband|3\.5|aux/.test(l)?'nb':/speaker/.test(l)?'spk':'?'};
async function outScan(){try{outDevs=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind=='audiooutput')}catch(e){outDevs=[]}}
async function outMenu(){const o=$('om');if(o.style.display=='flex'){o.style.display='none';return}await outScan();outDraw();o.style.display='flex'}
function outDraw(){const o=$('om');if(!sinkOk()){o.innerHTML='<div style="font-size:13px;opacity:.85;text-align:center;max-width:280px">Ei browser (jemon iPhone Safari) app theke speaker/bluetooth bodlate dey na. Phone er Control Center ba Bluetooth setting theke select koro.</div>';return}
 const bs='padding:10px 14px;text-align:left;';
 o.innerHTML=[['spk','🔊','Loud speaker'],['bt','🎧','Bluetooth earphone'],['nb','🎧','Neckband / wired headset']].map(([k,i,l])=>{const d=outDevs.find(x=>outKind(x)==k);return `<button ${d?'':'disabled'} onclick="outSet('${k}')" style="${bs}${outSel==k?'background:#42b72a;':'background:#3a3b3c;'}${d?'':'opacity:.45;'}">${i} ${l}${outSel==k?' ✓':d?'':' (connect nai)'}</button>`}).join('')+
 outDevs.map((d,i)=>outKind(d)=='?'&&d.label?`<button onclick="outSet(${i})" style="${bs}background:${outSel===i?'#42b72a':'#3a3b3c'}">🔈 ${esc(d.label)}${outSel===i?' ✓':''}</button>`:'').join('')}
async function outSet(k){const d=typeof k=='number'?outDevs[k]:outDevs.find(x=>outKind(x)==k);if(!d)return;
 try{await $('rv').setSinkId(d.deviceId);outSel=k;outDraw()}catch(e){alert('Audio output bodlano jayni: '+(e.message||e))}}
function ui(n,s,b){$('cl').style.display='flex';$('cn').textContent=n;$('cs').textContent=s;$('cb').innerHTML=b}
async function media(v){ls=await navigator.mediaDevices.getUserMedia({audio:true,video:!!v});
 $('lv').srcObject=ls;$('lv').style.display=v?'block':'none';$('rv').style.display=v?'block':'none';
 pc=new RTCPeerConnection({iceServers:await iceS()});
 ls.getTracks().forEach(t=>pc.addTrack(t,ls));
 pc.onicecandidate=e=>e.candidate&&sig(peer,{t:'ice',c:e.candidate});
 pc.ontrack=e=>{$('rv').srcObject=e.streams[0];$('rv').play().catch(()=>{})};
 pc.onconnectionstatechange=()=>{const s=pc&&pc.connectionState;if(s=='connected'){clearTimeout(ct);ui(U(peer).name,'Connected',endBtn)}if(s=='disconnected')$('cs').textContent='Network problem... abar connect hochche';if(s=='failed'){alert('Call connect hoyni. TURN: '+((ICE||[]).length>1?'ache':'nai (server theke ashe ni)')+'. Settings e 🧪 Call test chalao.');end()}}}
async function iceS(){if(ICE&&Date.now()-ICEt<12e5)return ICE;const r=await api('ice');ICE=(r&&r.s)||[{urls:'stun:stun.l.google.com:19302'}];ICEt=Date.now();return ICE}
const armCt=ms=>{clearTimeout(ct);ct=setTimeout(()=>{if(pc&&pc.connectionState!='connected'){alert('Call connect hoyni. Onno jon uttor dey nai ba network block kore ache.');end()}},ms)}
async function flush(){for(const c of buf)try{await pc.addIceCandidate(c)}catch(e){}buf=[]}
async function call(id,v){if(pc||inc)return;peer=id;
 try{await media(v)}catch(e){peer=null;return alert('Mic/camera permission dao')}
 await pc.setLocalDescription(await pc.createOffer());sig(id,{t:'offer',sdp:pc.localDescription,v});
 ui(U(id).name,'Ringing...',endBtn);armCt(45000);api('msg/'+id,{text:(v?'🎥 Video':'📞 Voice')+' call kora hoyeche'}).then(load)}
async function onSig({from,data:d}){
 if(d.t=='offer'){if(inc&&inc.from==from)return;if(pc||inc)return sig(from,{t:'bye'});inc={from,d};
  ui(U(from).name,(d.v?'Video':'Voice')+' call ashche...','<button onclick="acc()" style="background:#42b72a;padding:12px 24px">Accept</button><button onclick="rej()" style="background:#e41e3f;padding:12px 24px">Reject</button>')}
 else if(d.t=='answer'&&pc){await pc.setRemoteDescription(d.sdp);await flush()}
 else if(d.t=='ice'){if(pc&&pc.remoteDescription)try{await pc.addIceCandidate(d.c)}catch(e){}else buf.push(d.c)}
 else if(d.t=='bye'&&from==(peer||(inc&&inc.from)))end(1)}
async function acc(){const{from,d}=inc;inc=null;peer=from;
 try{await media(d.v)}catch(e){sig(from,{t:'bye'});peer=null;$('cl').style.display='none';return alert('Mic/camera permission dao')}
 await pc.setRemoteDescription(d.sdp);await flush();await pc.setLocalDescription(await pc.createAnswer());
 sig(from,{t:'answer',sdp:pc.localDescription});ui(U(from).name,'Connecting...',endBtn);armCt(30000)}
function rej(){sig(inc.from,{t:'bye'});inc=null;$('cl').style.display='none'}
function end(n){outSel='';outDevs=[];$('om').style.display='none';clearTimeout(ct);if(n!==1&&peer)sig(peer,{t:'bye'});pc&&pc.close();ls&&ls.getTracks().forEach(t=>t.stop());pc=ls=peer=inc=null;buf=[];$('rv').srcObject=null;$('cl').style.display='none'}

draw();if(tk)start();
</script></body></html>
